<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#1c0942"/>
      <stop offset="100%" stop-color="#060010"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdf1b8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold-v" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9e0"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#7a5800"/>
    </linearGradient>
    <linearGradient id="gold-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a5800"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#7a5800"/>
    </linearGradient>
    <filter id="star-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="core-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Purple ambient aura -->
  <circle cx="256" cy="256" r="230" fill="url(#aura)"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="#d4af37" stroke-width="1.2" opacity="0.38"/>
  <!-- Inner subtle ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#d4af37" stroke-width="0.6" opacity="0.14"/>

  <!-- Cardinal tick marks (N/S/E/W) -->
  <line x1="256" y1="30"  x2="256" y2="55"  stroke="#d4af37" stroke-width="3.5" opacity="0.85" stroke-linecap="round"/>
  <line x1="256" y1="457" x2="256" y2="482" stroke="#d4af37" stroke-width="3.5" opacity="0.85" stroke-linecap="round"/>
  <line x1="30"  y1="256" x2="55"  y2="256" stroke="#d4af37" stroke-width="3.5" opacity="0.85" stroke-linecap="round"/>
  <line x1="457" y1="256" x2="482" y2="256" stroke="#d4af37" stroke-width="3.5" opacity="0.85" stroke-linecap="round"/>

  <!-- Diagonal tick marks (NE/SE/SW/NW) — at r=226, 45° -->
  <line x1="416" y1="96"  x2="403" y2="109" stroke="#d4af37" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
  <line x1="416" y1="416" x2="403" y2="403" stroke="#d4af37" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
  <line x1="96"  y1="416" x2="109" y2="403" stroke="#d4af37" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
  <line x1="96"  y1="96"  x2="109" y2="109" stroke="#d4af37" stroke-width="2" opacity="0.4" stroke-linecap="round"/>

  <!-- ── The 8-pointed compass star ──
       Outer cardinal: r=200  |  Outer diagonal: r=128  |  Inner notch: r=40
       Points (cx=256, cy=256) clockwise from N:
  -->
  <polygon
    points="
      256,56    271,220   344,168   292,242
      456,256   292,270   344,344   271,292
      256,456   241,292   168,344   220,270
      56,256    220,242   168,168   241,220
    "
    fill="url(#gold-v)"
    filter="url(#star-glow)"
  />

  <!-- Diamond accent dots at diagonal tips -->
  <circle cx="344" cy="168" r="5" fill="#fdf1b8" opacity="0.7"/>
  <circle cx="344" cy="344" r="5" fill="#fdf1b8" opacity="0.7"/>
  <circle cx="168" cy="344" r="5" fill="#fdf1b8" opacity="0.7"/>
  <circle cx="168" cy="168" r="5" fill="#fdf1b8" opacity="0.7"/>

  <!-- Center glow halo -->
  <circle cx="256" cy="256" r="42" fill="url(#center-glow)" filter="url(#core-glow)" opacity="0.6"/>

  <!-- Center orb -->
  <circle cx="256" cy="256" r="34" fill="#0d0520"/>
  <circle cx="256" cy="256" r="28" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.55"/>
  <circle cx="256" cy="256" r="16" fill="#d4af37" opacity="0.95"/>
  <circle cx="256" cy="256" r="9"  fill="#0d0520"/>
  <circle cx="256" cy="256" r="5"  fill="#fdf1b8"/>
</svg>
